<style>
:root{
  --bg:#f5f9fd;
  --card:#ffffff;
  --ink:#1f2d3d;
  --sub:#5b6b7d;
  --muted:#8a98a8;
  --brand:#2563eb;
  --brand-dark:#1e4fb8;
  --brand-soft:#e6f0ff;
  --accent:#ff8a3d;
  --line:#e2e9f2;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans KR","Noto Sans",system-ui,-apple-system,sans-serif;
  line-height:1.65;
  font-size:16px;
  overflow-x:hidden;
}
a{color:var(--brand)}

.brand{background:#ffffff;padding:14px 16px 10px;text-align:center;border-bottom:1px solid var(--line)}
.brand img{max-width:360px;width:100%;height:auto;display:inline-block}
/* 상단 국기 바 */
header{
  position:sticky;top:0;z-index:10;
  background:#ffffff;
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(30,60,100,.05);
}
.flags{
  display:grid;
  grid-template-columns:repeat(15,1fr);
  gap:4px;
  padding:8px 12px;
  max-width:1200px;margin:0 auto;
}
.flags::-webkit-scrollbar{height:4px}
.flags::-webkit-scrollbar-thumb{background:#c8d6e6;border-radius:4px}
.flag{
  min-width:0;
  padding:5px 2px 4px;
  border:2px solid transparent;
  border-radius:12px;
  background:transparent;
  text-align:center;
  text-decoration:none;
  color:var(--sub);
  font-size:11px;
  line-height:1.3;
  white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.flag:hover{background:#f0f6ff}
.flag img{
  display:block;
  width:40px;height:auto;
  margin:0 auto 4px;
  border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.flag[aria-current="true"]{
  border-color:var(--brand);
  background:var(--brand-soft);
  color:var(--brand-dark);
  font-weight:700;
}

/* 휴대폰에서는 가로로 밀어서 보기 */
@media (max-width:760px){
  .flags{
    grid-template-columns:repeat(5,1fr);
    gap:6px 4px;
    padding:8px 8px;
  }
  .flag{font-size:12px}
  .flag img{width:44px}
  header{position:static}
}

/* 본문 */
main{
  max-width:860px;
  margin:0 auto;
  padding:24px 16px 40px;
}
.hero{
  background:linear-gradient(135deg,#ffffff 0%,#e6f0ff 100%);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:28px 24px;
  box-shadow:0 4px 16px rgba(30,60,100,.06);
}
.kicker{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  font-size:13px;font-weight:700;
  padding:3px 10px;border-radius:999px;
  margin-bottom:10px;
}
h1{
  font-size:30px;line-height:1.3;
  margin:0 0 10px;
  color:#17448f;
}
.lead{
  font-size:17px;
  color:var(--sub);
  margin:0;
}
h2{
  font-size:20px;
  margin:28px 0 12px;
  color:var(--ink);
}
.lang-head{
  display:flex;align-items:center;gap:16px;
  margin-bottom:16px;
}
.lang-head img{
  width:84px;height:auto;
  border-radius:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
  flex:0 0 auto;
}
.lang-head .sub{color:var(--sub);font-size:14px;margin-top:4px}
.lang-head h1{font-size:26px;margin:0}
.back{
  display:inline-block;
  margin-bottom:14px;
  font-size:14px;
  text-decoration:none;
  color:var(--brand);
}
.intro{
  background:var(--card);
  border:1px solid var(--line);
  border-left:5px solid var(--accent);
  border-radius:var(--radius);
  padding:18px 20px;
  margin:0 0 14px;
  font-size:17px;
}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media (min-width:640px){
  .grid{grid-template-columns:1fr 1fr}
  .grid .wide{grid-column:1 / -1}
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:0 2px 10px rgba(30,60,100,.05);
}
.card h3{
  margin:0 0 8px;
  font-size:15px;
  color:var(--brand-dark);
}
.card p{margin:0 0 6px;font-size:16px}
.card p:last-child{margin-bottom:0}
.ko{
  display:block;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--line);
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.ko-tag{
  font-weight:700;
  margin-right:4px;
}
.svc{margin:0;padding:0;list-style:none}
.svc li{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 16px;
  margin-bottom:10px;
  font-size:15px;
  line-height:1.6;
}
.svc .loc{color:var(--ink)}
.svc .name{font-weight:700;color:var(--brand-dark)}
.btn{
  display:inline-block;
  margin-top:12px;
  background:var(--brand);
  color:#fff !important;
  text-decoration:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:500;
  font-size:15px;
}
.btn:hover{background:var(--brand-dark)}
footer{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  padding:20px 16px 32px;
}
@media (max-width:480px){
  h1{font-size:25px}
  .lang-head img{width:64px}
  .lang-head h1{font-size:21px}
}
</style>

/* ===== 화면 만들기 ===== */
function esc(s){ return s; }

function buildFlags(){
  const nav = document.getElementById("flags");
  nav.innerHTML = "";
  FLAGS.forEach(f => {
    const a = document.createElement("a");
    a.className = "flag";
    a.href = "#" + f.id;
    a.title = f.ko;
    a.innerHTML =
      '<img src="https://flagcdn.com/w160/' + f.flag + '.png" ' +
      'srcset="https://flagcdn.com/w320/' + f.flag + '.png 2x" ' +
      'alt="' + f.ko + ' 국기" width="40" loading="lazy">' +
      '<span>' + f.ko + '</span>';
    nav.appendChild(a);
  });
}

/* 한 나라(또는 한국어) 페이지 본문 */
function pageFor(id){
  const isKo = (id === "ko");
  const data = isKo
    ? { title:"지역아동센터", intro:KO.intro, L:KO_LABELS, v:KO, native:"", ko:"" }
    : C[id];

  const showKo = false;            // 외국어 페이지에는 한국어를 표시하지 않음
  const koLine = (txt) => showKo && txt ? `<span class="ko"><span class="ko-tag">한국어</span>${txt}</span>` : "";

  // 1) 머리글
  const head = isKo
    ? `<section class="hero">
         <span class="kicker">아동복지시설</span>
         <h1>${data.title}</h1>
         <p class="lead">${data.intro}</p>
       </section>`
    : `<a class="back" href="#ko" aria-label="Korean"><img src="https://flagcdn.com/w40/kr.png" alt="" style="width:22px;vertical-align:middle;border-radius:3px;margin-right:6px">←</a>
       <div class="lang-head">
         <img src="https://flagcdn.com/w320/${FLAGS.find(f=>f.id===id).flag}.png" alt="${data.native}">
         <div>
           <h1>${data.title}</h1>
           <div class="sub">${data.native} · ${data.ko}</div>
         </div>
       </div>
       <p class="intro">${data.intro}</p>
       ${showKo ? `<p class="intro" style="border-left-color:#8a98a8;font-size:14px;color:#5b6b7d"><span class="ko-tag">한국어</span>${KO.intro}</p>` : ""}`;

  // 2) 이용대상 · 운영기관 · 이용시간 · 이용료
  const cards = `
    <div class="grid">
      <div class="card">
        <h3>${data.L[0]}${showKo ? ' <span style="font-weight:400;color:#8a98a8">(이용대상)</span>' : ""}</h3>
        <p>${data.v.elig}</p>
        ${koLine(KO.elig)}
      </div>

      <div class="card">
        <h3>${data.L[1]}${showKo ? ' <span style="font-weight:400;color:#8a98a8">(운영기관)</span>' : ""}</h3>
        <p>${data.v.op}</p>
        ${koLine(KO.op)}
        <p style="margin-top:10px;font-size:14px;color:var(--sub)">${data.v.opNote}</p>
        ${koLine(KO.opNote)}
      </div>

      <div class="card">
        <h3>${data.L[2]}${showKo ? ' <span style="font-weight:400;color:#8a98a8">(이용시간)</span>' : ""}</h3>
        <p>${data.v.hours.replace(/ · /g, "<br>")}</p>
        ${koLine(KO.hours)}
      </div>

      <div class="card">
        <h3>${data.L[3]}${showKo ? ' <span style="font-weight:400;color:#8a98a8">(이용료)</span>' : ""}</h3>
        <p><b>${data.v.fee}</b></p>
        <p style="font-size:14px;color:var(--sub)">${data.v.feeNote}</p>
        <p style="margin-top:10px;font-size:14px;color:var(--sub)">${data.v.general}</p>
        ${koLine(KO.fee + " · " + KO.feeNote + " " + KO.general)}
      </div>
    </div>`;

  // 3) 서비스내용
  const svcTitle = `<h2>${data.L[4]}${showKo ? ' <span style="font-size:14px;color:#8a98a8;font-weight:400">(서비스내용)</span>' : ""}</h2>`;
  const svcItems = data.v.services.map((s, i) => {
    const m = s.match(/^([^:(（]+)([:(（])(.*)$/);
    const name = m ? m[1].trim() : "";
    const rest = m ? m[3].replace(/[()（）]/g, "").trim() : s;
    const body = m ? `<span class="name">${name}</span>: ${rest}` : s;
    return `<li><span class="loc">${body}</span>${showKo ? `<span class="ko"><span class="ko-tag">한국어</span>${KO.services[i]}</span>` : ""}</li>`;
  }).join("");

  const svc = `${svcTitle}<ul class="svc">${svcItems}</ul>`;

  // 4) 정부24 바로가기
  const link = `<div class="card" style="margin-top:18px">
      ${isKo ? '<p>정부24(plus.gov.kr) · 돌봄시설 등 위치 찾기에서 우리 동네 센터를 확인하세요.</p>' : ''}
      <a class="btn" href="https://plus.gov.kr/" target="_blank" rel="noopener">plus.gov.kr${isKo ? ' 바로가기' : ''}</a>
    </div>`;

  return head + cards + svc + link;
}

/* ===== 화면 전환 ===== */
function render(){
  let id = (location.hash || "#ko").slice(1);
  if (id !== "ko" && !C[id]) id = "ko";

  document.querySelectorAll(".flag").forEach(a => {
    a.setAttribute("aria-current", a.getAttribute("href") === "#" + id ? "true" : "false");
  });

  document.getElementById("app").innerHTML = pageFor(id);
  document.getElementById("footer").style.display = (id === "ko") ? "" : "none";
  document.documentElement.lang = (id === "ko") ? "ko" : id;
  window.scrollTo(0, 0);
}

buildFlags();
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
